<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat</title>

<!-- ✅ FAVICON -->
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
  transition: 0.3s;
}

body.dark {
  background: #1e1e1e;
  color: white;
}

input, button {
  padding: 8px;
  margin: 5px;
}

#status {
  font-weight: bold;
  margin-top: 10px;
}

#users, #chatBox {
  background: white;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
}

body.dark #users,
body.dark #chatBox {
  background: #2a2a2a;
}

#chatBox {
  display: flex;
  flex-direction: column;
  height: 260px;
  border: 1px solid #ddd;
}

#messages {
  flex: 1;
  overflow-y: auto;
}

#chatInput {
  border: none;
  border-top: 1px solid #ccc;
  padding: 10px;
}

.system {
  color: gray;
  font-style: italic;
}

.msg {
  margin: 3px 0;
}
</style>
</head>

<body>

<h2>TMG Voice Chat</h2>

<input id="username" placeholder="Username">
<input id="room" value="main">

<button id="join">Join</button>
<button id="mute">Mute</button>
<button id="leave">Leave</button>
<button id="dark">Dark Mode</button>

<div id="status">Idle</div>

<h3>Users</h3>
<div id="users"></div>

<h3>Chat</h3>

<div id="chatBox">
  <div id="messages"></div>
  <input id="chatInput" placeholder="type message + Enter">
</div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  remove,
  push,
  onChildAdded,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQBBQ",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  databaseURL: "https://tmg-voice-chat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tmg-voice-chat",
  storageBucket: "tmg-voice-chat.firebasestorage.app",
  messagingSenderId: "928730903900",
  appId: "1:928730903900:web:0744dc6a61163539803d99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chatRef = ref(db, "chat");
const usersRef = ref(db, "users");

const messagesEl = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");
const usersEl = document.getElementById("users");
const statusEl = document.getElementById("status");

let user = "";
let myUserRef = null;

let room = null;
let me = null;
let mic = null;
let isMuted = false;

// ================= STATUS =================
function setStatus(text) {
  statusEl.innerText = text;
}

// ================= CHAT =================
function addMsg(text, type="msg") {
  const div = document.createElement("div");
  div.className = type;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = chatInput.value.trim();
    if (!text) return;

    push(chatRef, {
      user,
      text,
      type: "msg",
      time: Date.now()
    });

    chatInput.value = "";
  }
});

onChildAdded(chatRef, (snap) => {
  const msg = snap.val();

  if (msg.type === "system") {
    addMsg("• " + msg.text, "system");
  } else {
    addMsg(msg.user + ": " + msg.text);
  }
});

// ================= USERS =================
onValue(usersRef, (snap) => {
  const data = snap.val() || {};
  usersEl.innerHTML = "";

  Object.values(data).forEach(u => {
    const div = document.createElement("div");
    div.textContent = "🟢 " + u.name;
    usersEl.appendChild(div);
  });
});

// ================= JOIN =================
document.getElementById("join").onclick = async () => {

  setStatus("Connecting...");

  const username = document.getElementById("username").value.trim();
  const roomName = document.getElementById("room").value.trim();

  if (!username) return;

  user = username;

  const context = await skyway_room.SkyWayContext.CreateForDevelopment(
    "96d919fc-9c10-424b-9e4e-1addf4de2563",
    "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk="
  );

  room = await skyway_room.SkyWayRoom.FindOrCreate(
    context,
    { name: roomName }
  );

  mic = await skyway_room.SkyWayStreamFactory.createMicrophoneAudioStream();

  me = await room.join({ name: username });

  await me.publish(mic, { type: "p2p" });

  setStatus("Connected ✔");

  addMsg("• " + username + " joined", "system");

  myUserRef = ref(db, "users/" + username);

  set(myUserRef, {
    name: username,
    time: Date.now()
  });

  const subscribe = async (pub) => {
    if (pub.publisher.id === me.id) return;

    const { stream } = await me.subscribe(pub.id);

    const audio = document.createElement("audio");
    audio.autoplay = true;

    stream.attach(audio);
    document.body.appendChild(audio);
  };

  room.publications.forEach(subscribe);
  room.onStreamPublished.add(e => subscribe(e.publication));
};

// ================= MUTE =================
document.getElementById("mute").onclick = () => {
  if (!mic) return;

  isMuted = !isMuted;

  const track = mic.stream.getAudioTracks()[0];
  if (track) track.enabled = !isMuted;

  document.getElementById("mute").innerText =
    isMuted ? "🔇 Unmute" : "🎤 Mute";
};

// ================= LEAVE =================
document.getElementById("leave").onclick = () => {
  setStatus("Disconnected");

  if (myUserRef) remove(myUserRef);

  location.reload();
};

// ================= DARK MODE =================
document.getElementById("dark").onclick = () => {
  document.body.classList.toggle("dark");
};

</script>

</body>
</html>
