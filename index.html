<!DOCTYPE html>
<html>
<head>
  <title>REAL Voice Chat</title>
</head>
<body>

<h2>🎤 REAL WebRTC Voice Chat</h2>

<button id="call">Start Call (Tab 1)</button>
<button id="join">Join Call (Tab 2)</button>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  projectId: "tmg-voice-chat"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

let pc;
let localStream;

async function setupPeer() {
  pc = new RTCPeerConnection(servers);

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    document.getElementById("remoteAudio").srcObject = event.streams[0];
  };

  // ICE candidates σωστά (BOTH SIDES)
  pc.onicecandidate = async (event) => {
    if (event.candidate) {
      await setDoc(doc(db, "call", "candidate"), {
        candidate: JSON.stringify(event.candidate)
      });
    }
  };
}

/* =========================
   CALLER (Tab 1)
========================= */
document.getElementById("call").onclick = async () => {
  await setupPeer();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(doc(db, "call", "offer"), {
    offer: JSON.stringify(offer)
  });

  // wait for answer
  onSnapshot(doc(db, "call", "answer"), async (snap) => {
    const data = snap.data();
    if (data?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(JSON.parse(data.answer));
    }
  });
};

/* =========================
   JOINER (Tab 2)
========================= */
document.getElementById("join").onclick = async () => {
  await setupPeer();

  const offerSnap = await getDoc(doc(db, "call", "offer"));
  const offer = JSON.parse(offerSnap.data().offer);

  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await setDoc(doc(db, "call", "answer"), {
    answer: JSON.stringify(answer)
  });
};
</script>

</body>
</html>
