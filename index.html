<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Voice Chat FIX</title>
</head>
<body style="font-family: Arial; text-align:center; padding-top:50px;">

<h2>🎧 Simple Voice Chat</h2>

<input id="room" placeholder="Room ID (πχ: test123)" />
<button onclick="join()">Join</button>

<p id="status">Disconnected</p>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
let peer;
let localStream;
let currentCall;
let connections = [];

async function join() {
  const roomId = document.getElementById("room").value;
  if (!roomId) return alert("Βάλε Room ID");

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  peer = new Peer(undefined, {
    host: "0.peerjs.com",
    port: 443,
    secure: true
  });

  peer.on('open', id => {
    document.getElementById("status").innerText = "Connected: " + id;

    // connect to "room hub"
    const conn = peer.connect(roomId);
    connections.push(conn);

    conn.on('open', () => {
      conn.send({ type: "join", id: peer.id });
    });
  });

  // incoming calls
  peer.on('call', call => {
    call.answer(localStream);
    call.on('stream', remoteStream => {
      play(remoteStream);
    });
  });

  // incoming data (room logic)
  peer.on('connection', conn => {
    conn.on('data', data => {
      if (data.type === "join") {
        callPeer(data.id);
      }
    });
  });
}

function callPeer(id) {
  if (id === peer.id) return;

  const call = peer.call(id, localStream);

  call.on('stream', remoteStream => {
    play(remoteStream);
  });
}

function play(stream) {
  const audio = document.createElement("audio");
  audio.srcObject = stream;
  audio.autoplay = true;
  document.body.appendChild(audio);
}
</script>

</body>
</html>
