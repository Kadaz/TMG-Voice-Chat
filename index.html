<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RAW Voice Chat</title>
</head>
<body style="font-family:Arial; text-align:center; padding-top:40px;">

<h2>🎧 Voice Chat</h2>

<input id="room" placeholder="Room ID" />
<button onclick="start()">Start</button>

<p id="status">idle</p>

<script>
let pc;
let localStream;
let channel;

const config = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

async function start() {
  const room = document.getElementById("room").value;
  if (!room) return;

  document.getElementById("status").innerText = "starting mic...";

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  pc = new RTCPeerConnection(config);

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = (e) => {
    const audio = document.createElement("audio");
    audio.srcObject = e.streams[0];
    audio.autoplay = true;
    document.body.appendChild(audio);
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      channel.postMessage({ type: "ice", data: e.candidate });
    }
  };

  channel = new BroadcastChannel("voice_" + room);

  channel.onmessage = async (msg) => {
    const data = msg.data;

    if (data.type === "offer") {
      await pc.setRemoteDescription(data.offer);

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      channel.postMessage({ type: "answer", answer });
    }

    if (data.type === "answer") {
      await pc.setRemoteDescription(data.answer);
    }

    if (data.type === "ice") {
      try {
        await pc.addIceCandidate(data.data);
      } catch {}
    }
  };

  // decide caller/receiver automatically
  const isCaller = Math.random() > 0.5;

  if (isCaller) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    channel.postMessage({ type: "offer", offer });
    document.getElementById("status").innerText = "calling...";
  } else {
    document.getElementById("status").innerText = "waiting...";
  }
}
</script>

</body>
</html>
