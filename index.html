<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LAN Voice Chat</title>
</head>
<body>
  <h2>Voice Chat</h2>

  <button id="start">Start</button>
  <button id="call">Call</button>
  <button id="answer">Answer</button>

  <textarea id="out" style="width:100%;height:120px;"></textarea>
  <textarea id="in" style="width:100%;height:120px;"></textarea>

  <script src="https://unpkg.com/simple-peer/simplepeer.min.js"></script>
  <script>
    let peer, stream;

    navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {
      stream = s;
    });

    function createPeer(initiator){
      peer = new SimplePeer({ initiator, trickle: false, stream });

      peer.on('signal', data => {
        document.getElementById("out").value = JSON.stringify(data);
      });

      peer.on('stream', remote => {
        let audio = new Audio();
        audio.srcObject = remote;
        audio.play();
      });
    }

    document.getElementById("start").onclick = () => createPeer(false);
    document.getElementById("call").onclick = () => createPeer(true);

    document.getElementById("answer").onclick = () => {
      peer.signal(JSON.parse(document.getElementById("in").value));
    };
  </script>
</body>
</html>
