<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple Voice Chat</title>
</head>
<body>

<h2>VOICE CHAT</h2>

<input id="room" placeholder="room id">
<button onclick="join()">Join Room</button>

<script>
let pc;
let localStream;
let roomId;

// 🟢 public signaling server (δεν χρειάζεται setup)
const SIGNALING = "https://signaling.simplewebrtc.dev";

async function getMic() {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
}

function setupPeer() {
  pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = (e) => {
    const audio = document.createElement("audio");
    audio.autoplay = true;
    audio.srcObject = e.streams[0];
    document.body.appendChild(audio);
  };

  pc.onicecandidate = async (e) => {
    if (!e.candidate) return;

    await fetch(`${SIGNALING}/signal`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        room: roomId,
        candidate: e.candidate
      })
    });
  };
}

async function join() {
  roomId = document.getElementById("room").value;

  await getMic();
  setupPeer();

  // create or join
  const offerRes = await fetch(`${SIGNALING}/offer?room=${roomId}`);
  const offer = await offerRes.json();

  if (!offer || !offer.sdp) {
    const newOffer = await pc.createOffer();
    await pc.setLocalDescription(newOffer);

    await fetch(`${SIGNALING}/offer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: roomId, sdp: newOffer })
    });

  } else {
    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    await fetch(`${SIGNALING}/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: roomId, sdp: answer })
    });
  }

  setInterval(async () => {
    const res = await fetch(`${SIGNALING}/answer?room=${roomId}`);
    const answer = await res.json();

    if (answer?.sdp && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(answer);
    }
  }, 2000);
}
</script>

</body>
</html>
