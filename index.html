<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Chat</title>
</head>
<body style="font-family:Arial; text-align:center; padding-top:40px;">

<h2>🎧 Voice Chat</h2>

<input id="room" placeholder="Room ID" />
<button onclick="join()">Join</button>

<p id="status">idle</p>

<audio id="audio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://webrtc-signaling-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let pc;
let roomId;

const config = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

async function join() {
  roomId = document.getElementById("room").value;
  if (!roomId) return;

  document.getElementById("status").innerText = "connecting...";

  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  pc = new RTCPeerConnection(config);

  stream.getTracks().forEach(t => pc.addTrack(t, stream));

  pc.ontrack = (e) => {
    document.getElementById("audio").srcObject = e.streams[0];
  };

  const roomRef = ref(db, "rooms/" + roomId);

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      set(ref(db, "rooms/" + roomId + "/ice"), JSON.stringify(e.candidate));
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  set(ref(db, "rooms/" + roomId + "/offer"), JSON.stringify(offer));

  onValue(roomRef, async (snap) => {
    const data = snap.val();
    if (!data) return;

    if (data.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(JSON.parse(data.answer));
      document.getElementById("status").innerText = "connected";
    }

    if (data.ice && pc.remoteDescription) {
      try {
        await pc.addIceCandidate(JSON.parse(data.ice));
      } catch {}
    }
  });

  onValue(ref(db, "rooms/" + roomId + "/offer"), async (snap) => {
    const offer = snap.val();
    if (!offer || pc.currentRemoteDescription) return;

    await pc.setRemoteDescription(JSON.parse(offer));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    set(ref(db, "rooms/" + roomId + "/answer"), JSON.stringify(answer));
  });

  document.getElementById("status").innerText = "ready";
}
</script>

</body>
</html>
