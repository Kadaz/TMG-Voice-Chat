<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat</title>
</head>
<body>

<h2>TMG Voice Chat</h2>

<input id="username" placeholder="Username">
<input id="roomname" placeholder="Room Name" value="main">
<button id="join">Join</button>

<div>
  <b>My ID:</b>
  <span id="myid">-</span>
</div>

<div id="users"></div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script>

const APP_ID = "96d919fc-9c10-424b-9e4e-1addf4de2563";
const SECRET = "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk=";

const joinBtn = document.getElementById("join");
const roomInput = document.getElementById("roomname");
const usernameInput = document.getElementById("username");
const myIdEl = document.getElementById("myid");
const usersEl = document.getElementById("users");

joinBtn.onclick = async () => {

  const username = usernameInput.value.trim();
  const roomName = roomInput.value.trim();

  if (!username || !roomName) {
    alert("Username and Room required");
    return;
  }

  const context =
    await skyway_room.SkyWayContext.CreateForDevelopment(
      APP_ID,
      SECRET
    );

  const room =
    await skyway_room.SkyWayRoom.FindOrCreate(
      context,
      {
        name: roomName
      }
    );

  const audio =
    await skyway_room.SkyWayStreamFactory
      .createMicrophoneAudioStream();

  const me =
    await room.join({
      name: username
    });

  myIdEl.textContent = me.id;

  await me.publish(audio, {
    type: "p2p"
  });

  const subscribePublication = async (publication) => {

    if (publication.publisher.id === me.id) {
      return;
    }

    const { stream } =
      await me.subscribe(publication.id);

    const audioElement =
      document.createElement("audio");

    audioElement.autoplay = true;

    stream.attach(audioElement);

    document.body.appendChild(audioElement);
  };

  room.publications.forEach(
    subscribePublication
  );

  room.onStreamPublished.add((e) => {
    subscribePublication(e.publication);
  });

  usersEl.innerHTML =
    "<p>Connected to room: " +
    roomName +
    "</p>";
};

</script>

</body>
</html>
