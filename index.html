<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat + Firebase Chat</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, button {
  padding: 8px;
  margin: 5px;
}

#status {
  margin-top: 10px;
  font-weight: bold;
}

#log {
  font-size: 13px;
  color: #444;
  margin-top: 10px;
  white-space: pre-line;
}

#chatBox {
  margin-top: 20px;
  border: 1px solid #ddd;
  height: 200px;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  font-size: 14px;
}

#chatInput {
  border: none;
  border-top: 1px solid #ddd;
  padding: 10px;
}
</style>
</head>

<body>

<h2>TMG Voice Chat</h2>

<input id="username" placeholder="Username">
<input id="room" value="main" placeholder="Room">
<button id="join">Join</button>

<div id="status">Idle</div>
<div id="log"></div>

<hr>

<h3>Chat</h3>

<div id="chatBox">
  <div id="messages"></div>
  <input id="chatInput" placeholder="type message + Enter">
</div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script type="module">

// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  databaseURL: "https://tmg-voice-chat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tmg-voice-chat",
  storageBucket: "tmg-voice-chat.firebasestorage.app",
  messagingSenderId: "928730903900",
  appId: "1:928730903900:web:0744dc6a61163539803d99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const chatRef = ref(db, "chat");

// ================= CHAT =================
const messagesEl = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");

const user = "user-" + Math.random().toString(16).slice(2, 6);

function addMsg(u, text) {
  const div = document.createElement("div");
  div.textContent = u + ": " + text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = chatInput.value.trim();
    if (!text) return;

    push(chatRef, {
      user,
      text,
      time: Date.now()
    });

    chatInput.value = "";
  }
});

onChildAdded(chatRef, (snap) => {
  const msg = snap.val();
  addMsg(msg.user, msg.text);
});

// ================= SKYWAY VOICE =================
const APP_ID = "96d919fc-9c10-424b-9e4e-1addf4de2563";
const SECRET = "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk=";

let context;
let room;
let me;

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function log(msg) {
  logEl.innerHTML += msg + "<br>";
}

function setStatus(msg) {
  statusEl.innerText = msg;
  log(msg);
}

document.getElementById("join").onclick = async () => {

  const username =
    document.getElementById("username").value.trim() ||
    user;

  const roomName = document.getElementById("room").value.trim();

  try {

    setStatus("Creating context...");

    context = await skyway_room.SkyWayContext.CreateForDevelopment(
      APP_ID,
      SECRET
    );

    setStatus("Loading room...");

    room = await skyway_room.SkyWayRoom.FindOrCreate(
      context,
      { name: roomName }
    );

    setStatus("Getting microphone...");

    const mic =
      await skyway_room.SkyWayStreamFactory
        .createMicrophoneAudioStream();

    setStatus("Joining room...");

    me = await room.join({ name: username });

    setStatus("Publishing audio...");

    await me.publish(mic, { type: "p2p" });

    setStatus("Connected ✔");

    log("My ID: " + me.id);

    const subscribe = async (publication) => {

      if (publication.publisher.id === me.id) return;

      const { stream } = await me.subscribe(publication.id);

      const audio = document.createElement("audio");
      audio.autoplay = true;
      audio.playsInline = true;

      stream.attach(audio);
      document.body.appendChild(audio);
    };

    room.publications.forEach(subscribe);

    room.onStreamPublished.add((e) => {
      subscribe(e.publication);
    });

  } catch (err) {
    setStatus("ERROR: " + err.message);
    log(err.stack || err);
  }
};

// ================= SAFE INIT =================
setStatus("Ready");

</script>

</body>
</html>
