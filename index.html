<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat</title>
<style>
body { font-family: Arial; padding: 20px; }
input, button { margin: 5px; padding: 8px; }
audio { display: block; margin-top: 10px; }
</style>
</head>

<body>

<h2>TMG Voice Chat</h2>

<input id="username" placeholder="Username">
<input id="roomname" value="main" placeholder="Room">
<button id="join">Join</button>

<hr>

<div><b>My ID:</b> <span id="myid">-</span></div>
<div id="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script>

const APP_ID = "96d919fc-9c10-424b-9e4e-1addf4de2563";
const SECRET = "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk=";

const joinBtn = document.getElementById("join");
const myIdEl = document.getElementById("myid");
const statusEl = document.getElementById("status");

let context;
let room;
let me;

joinBtn.onclick = async () => {

  const username = document.getElementById("username").value.trim();
  const roomName = document.getElementById("roomname").value.trim();

  if (!username || !roomName) {
    alert("Fill username + room");
    return;
  }

  statusEl.innerText = "Connecting...";

  // 🔥 SkyWay context (development mode)
  context = await skyway_room.SkyWayContext.CreateForDevelopment(
    APP_ID,
    SECRET
  );

  // Room create / join
  room = await skyway_room.SkyWayRoom.FindOrCreate(
    context,
    { name: roomName }
  );

  // mic
  const audioStream =
    await skyway_room.SkyWayStreamFactory.createMicrophoneAudioStream();

  me = await room.join({ name: username });

  myIdEl.innerText = me.id;

  // publish audio
  await me.publish(audioStream, { type: "p2p" });

  // subscribe function
  const subscribe = async (publication) => {

    if (publication.publisher.id === me.id) return;

    const { stream } = await me.subscribe(publication.id);

    const audio = document.createElement("audio");
    audio.autoplay = true;
    audio.playsInline = true;
    audio.controls = false;

    stream.attach(audio);

    document.body.appendChild(audio);

    audio.onloadedmetadata = async () => {
      try {
        await audio.play();
      } catch (e) {
        console.log("autoplay blocked", e);
      }
    };
  };

  // existing users
  room.publications.forEach(subscribe);

  // new users
  room.onStreamPublished.add((e) => {
    subscribe(e.publication);
  });

  statusEl.innerText = "Connected to room: " + roomName;

  // unlock audio policy
  document.body.addEventListener("click", async () => {
    const tmp = new Audio();
    await tmp.play().catch(()=>{});
  }, { once: true });

};

</script>

</body>
</html>
