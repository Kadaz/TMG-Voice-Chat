<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Voice Chat Fixed</title>
</head>
<body>
  <h2>Voice Chat (Fixed)</h2>

  <input id="room" placeholder="room id (π.χ. test123)" />
  <button onclick="join()">Join (Caller)</button>
  <button onclick="call()">Call (Callee)</button>
  <button onclick="hang()">Hang</button>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // 🔥 YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
      authDomain: "tmg-voice-chat.firebaseapp.com",
      projectId: "tmg-voice-chat",
      storageBucket: "tmg-voice-chat.firebasestorage.app",
      messagingSenderId: "928730903900",
      appId: "1:928730903900:web:0744dc6a61163539803d99",
      measurementId: "G-LSX97H9TQH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let pc;
    let roomRef;
    let localStream;

    const servers = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    async function getAudio() {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });
    }

    function setupPeer() {
      pc = new RTCPeerConnection(servers);

      localStream.getTracks().forEach(track => {
        pc.addTrack(track, localStream);
      });

      // 🔥 REMOTE AUDIO FIX (IMPORTANT)
      pc.ontrack = (event) => {
        const audio = document.createElement("audio");
        audio.autoplay = true;
        audio.playsInline = true;
        audio.srcObject = event.streams[0];
        document.body.appendChild(audio);
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          const collection = isCaller ? "callerCandidates" : "calleeCandidates";
          roomRef.collection(collection).add(event.candidate.toJSON());
        }
      };

      pc.oniceconnectionstatechange = () => {
        console.log("ICE:", pc.iceConnectionState);
      };
    }

    let isCaller = false;

    // 🟢 CALLER
    async function join() {
      isCaller = true;

      const roomId = document.getElementById("room").value;
      roomRef = db.collection("rooms").doc(roomId);

      await getAudio();
      setupPeer();

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      await roomRef.set({ offer });

      roomRef.onSnapshot(async snap => {
        const data = snap.data();
        if (data?.answer && !pc.currentRemoteDescription) {
          await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
      });

      roomRef.collection("callerCandidates").onSnapshot(snapshot => {
        snapshot.docChanges().forEach(async change => {
          if (change.type === "added") {
            await pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });
    }

    // 🟢 CALLEE
    async function call() {
      isCaller = false;

      const roomId = document.getElementById("room").value;
      roomRef = db.collection("rooms").doc(roomId);

      await getAudio();
      setupPeer();

      const offerDoc = await roomRef.get();
      const offer = offerDoc.data().offer;

      await pc.setRemoteDescription(new RTCSessionDescription(offer));

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await roomRef.update({ answer });

      roomRef.collection("calleeCandidates").onSnapshot(snapshot => {
        snapshot.docChanges().forEach(async change => {
          if (change.type === "added") {
            await pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          }
        });
      });
    }

    function hang() {
      if (pc) pc.close();
    }
  </script>
</body>
</html>
