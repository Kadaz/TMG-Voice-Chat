<!DOCTYPE html>
<html>
<head>
  <title>2P Voice Chat Simple</title>
</head>
<body>

<h2>🎤 2 Person Voice Chat</h2>

<button id="start">Start / Create</button>
<button id="join">Join</button>
<button id="leave">Leave</button>

<p>LOCAL</p>
<audio id="localAudio" autoplay muted></audio>

<p>REMOTE</p>
<audio id="remoteAudio" autoplay></audio>

<textarea id="box" placeholder="offer/answer here" rows="6" cols="50"></textarea><br>

<button id="set">Set</button>

<script>
let pc;
let stream;

const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

async function init() {
  pc = new RTCPeerConnection(servers);

  stream = await navigator.mediaDevices.getUserMedia({ audio: true });

  document.getElementById("localAudio").srcObject = stream;

  stream.getTracks().forEach(t => pc.addTrack(t, stream));

  pc.ontrack = (e) => {
    document.getElementById("remoteAudio").srcObject = e.streams[0];
  };
}

/* CREATE */
document.getElementById("start").onclick = async () => {
  await init();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  document.getElementById("box").value = JSON.stringify(pc.localDescription);
};

/* JOIN */
document.getElementById("join").onclick = async () => {
  await init();
};

/* SET OFFER/ANSWER */
document.getElementById("set").onclick = async () => {
  const data = JSON.parse(document.getElementById("box").value);

  if (!pc.currentRemoteDescription) {
    await pc.setRemoteDescription(data);

    if (data.type === "offer") {
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      document.getElementById("box").value =
        JSON.stringify(pc.localDescription);
    }
  } else {
    await pc.setRemoteDescription(data);
  }
};

/* LEAVE */
document.getElementById("leave").onclick = () => {
  if (pc) pc.close();

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  document.getElementById("remoteAudio").srcObject = null;
  document.getElementById("localAudio").srcObject = null;

  alert("Left voice chat");
};
</script>

</body>
</html>
