<!DOCTYPE html>
<html>
<head>
  <title>Voice Chat</title>
</head>
<body>

<h2>🎤 Simple Voice Chat</h2>

<button id="start">Start Call</button>
<button id="stop">Stop</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  projectId: "tmg-voice-chat"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ICE servers (για connection)
const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

let pc;
let localStream;

// START CALL
document.getElementById("start").onclick = async () => {
  pc = new RTCPeerConnection(servers);

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(doc(db, "calls", "room1"), {
    offer: JSON.stringify(offer)
  });

  pc.onicecandidate = async (event) => {
    if (event.candidate) {
      await setDoc(doc(db, "calls", "candidate"), {
        candidate: JSON.stringify(event.candidate)
      });
    }
  };

  onSnapshot(doc(db, "calls", "answer"), (snap) => {
    if (snap.exists()) {
      const answer = JSON.parse(snap.data().answer);
      pc.setRemoteDescription(answer);
    }
  });
};

// STOP
document.getElementById("stop").onclick = () => {
  if (pc) pc.close();
  if (localStream) localStream.getTracks().forEach(t => t.stop());
};
</script>

</body>
</html>
