<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat - Discord Mode</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  display: flex;
  gap: 20px;
}

#left {
  width: 300px;
}

#right {
  flex: 1;
}

input, button {
  padding: 8px;
  margin: 5px 0;
  width: 100%;
}

#status {
  font-weight: bold;
  margin-top: 10px;
}

#users {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid #ddd;
  min-height: 100px;
}

.user {
  padding: 5px;
  border-bottom: 1px solid #eee;
}

#chatBox {
  border: 1px solid #ddd;
  height: 400px;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

#chatInput {
  border: none;
  border-top: 1px solid #ddd;
  padding: 10px;
}

.msg {
  margin-bottom: 5px;
}
</style>
</head>

<body>

<div id="left">

<h3>Voice</h3>

<input id="username" placeholder="Username">
<input id="room" value="main">

<button id="join">Join</button>

<div id="status">Idle</div>

<h3>Users</h3>
<div id="users"></div>

</div>

<div id="right">

<h3>Chat</h3>

<div id="chatBox">
  <div id="messages"></div>
  <input id="chatInput" placeholder="type message + Enter">
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script>

const APP_ID = "96d919fc-9c10-424b-9e4e-1addf4de2563";
const SECRET = "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk=";

let room;
let me;
let mic;
let users = {};
let pushToTalk = false;

const statusEl = document.getElementById("status");
const usersEl = document.getElementById("users");
const messagesEl = document.getElementById("messages");

function logChat(user, text) {
  const div = document.createElement("div");
  div.className = "msg";
  div.innerText = user + ": " + text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderUsers() {
  usersEl.innerHTML = "";
  Object.values(users).forEach(name => {
    const div = document.createElement("div");
    div.className = "user";
    div.innerText = name;
    usersEl.appendChild(div);
  });
}

function sendChat(text) {
  room.send({ type: "chat", data: text });
}

document.getElementById("join").onclick = async () => {

  const username =
    document.getElementById("username").value.trim() ||
    ("user-" + Math.random().toString(16).slice(2));

  const roomName = document.getElementById("room").value.trim();

  statusEl.innerText = "Connecting...";

  const context = await skyway_room.SkyWayContext.CreateForDevelopment(
    APP_ID,
    SECRET
  );

  room = await skyway_room.SkyWayRoom.FindOrCreate(
    context,
    { name: roomName }
  );

  mic = await skyway_room.SkyWayStreamFactory
    .createMicrophoneAudioStream();

  me = await room.join({ name: username });

  await me.publish(mic, { type: "p2p" });

  users[me.id] = username;
  renderUsers();

  statusEl.innerText = "Connected ✔";

  // ---------------- AUDIO ----------------
  const subscribe = async (pub) => {

    if (pub.publisher.id === me.id) return;

    const { stream } = await me.subscribe(pub.id);

    const audio = document.createElement("audio");
    audio.autoplay = true;

    stream.attach(audio);
    document.body.appendChild(audio);

  };

  room.publications.forEach(subscribe);
  room.onStreamPublished.add(e => subscribe(e.publication));

  // ---------------- CHAT ----------------
  room.onDataChannelMessage?.add?.((e) => {
    if (e.data?.type === "chat") {
      logChat(e.src.name || "user", e.data.data);
    }
  });

  // fallback chat (SkyWay sometimes uses send/receive)
  room.onDataChannelMessage = room.onDataChannelMessage || ((e) => {
    if (e.data?.type === "chat") {
      logChat(e.src.name || "user", e.data.data);
    }
  });

};

// ENTER CHAT
document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = e.target.value.trim();
    if (!text) return;

    logChat("me", text);
    room.send({ type: "chat", data: text });

    e.target.value = "";
  }
});

// ---------------- PUSH TO TALK ----------------
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && mic) {
    mic.enabled = true;
  }
});

document.addEventListener("keyup", (e) => {
  if (e.code === "Space" && mic) {
    mic.enabled = false;
  }
});

</script>

</body>
</html>
