<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Voice Chat FIXED</title>
</head>
<body>
  <h2>Voice Chat FIXED</h2>

  <input id="room" placeholder="room id" />
  <button onclick="start(true)">Join (Host)</button>
  <button onclick="start(false)">Join (Guest)</button>
  <button onclick="hang()">Hang</button>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
      authDomain: "tmg-voice-chat.firebaseapp.com",
      projectId: "tmg-voice-chat",
      storageBucket: "tmg-voice-chat.firebasestorage.app",
      messagingSenderId: "928730903900",
      appId: "1:928730903900:web:0744dc6a61163539803d99",
      measurementId: "G-LSX97H9TQH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let pc;
    let roomRef;
    let stream;
    let isHost = false;

    const servers = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
      ]
    };

    async function getStream() {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }

    function createPeer() {
      pc = new RTCPeerConnection(servers);

      stream.getTracks().forEach(t => pc.addTrack(t, stream));

      pc.ontrack = (e) => {
        const audio = document.createElement("audio");
        audio.autoplay = true;
        audio.controls = false;
        audio.srcObject = e.streams[0];
        document.body.appendChild(audio);
      };

      pc.onicecandidate = async (e) => {
        if (!e.candidate) return;

        const col = isHost ? "hostCandidates" : "guestCandidates";
        await roomRef.collection(col).add(e.candidate.toJSON());
      };

      pc.onconnectionstatechange = () => {
        console.log("STATE:", pc.connectionState);
      };
    }

    async function start(host) {
      isHost = host;

      const roomId = document.getElementById("room").value;
      roomRef = db.collection("rooms").doc(roomId);

      await getStream();
      createPeer();

      if (host) {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        await roomRef.set({ offer });

        roomRef.onSnapshot(async snap => {
          const data = snap.data();
          if (data?.answer && !pc.currentRemoteDescription) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
          }
        });

        roomRef.collection("hostCandidates").onSnapshot(snap => {
          snap.docChanges().forEach(async c => {
            if (c.type === "added") {
              await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
            }
          });
        });

      } else {
        const doc = await roomRef.get();
        const offer = doc.data().offer;

        await pc.setRemoteDescription(new RTCSessionDescription(offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        await roomRef.update({ answer });

        roomRef.collection("guestCandidates").onSnapshot(snap => {
          snap.docChanges().forEach(async c => {
            if (c.type === "added") {
              await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
            }
          });
        });
      }
    }

    function hang() {
      if (pc) pc.close();
    }
  </script>
</body>
</html>
