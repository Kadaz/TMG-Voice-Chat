<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Voice Chat</title>
</head>
<body style="font-family: Arial; text-align:center; padding-top:40px;">

<h2>🎧 Voice Chat</h2>

<input id="room" placeholder="Room ID (ίδιο και στους 2)" />
<button onclick="start()">Join</button>

<p id="status">idle</p>

<script>
let pc;
let localStream;
let socket = null;

// PUBLIC STUN (αυτό κάνει τη μαγεία)
const config = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

async function start() {
  const room = document.getElementById("room").value;
  if (!room) return alert("βάλε room id");

  document.getElementById("status").innerText = "getting mic...";

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  pc = new RTCPeerConnection(config);

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.ontrack = (event) => {
    const audio = document.createElement("audio");
    audio.srcObject = event.streams[0];
    audio.autoplay = true;
    document.body.appendChild(audio);
  };

  pc.onicecandidate = async (event) => {
    if (event.candidate) {
      localStorage.setItem("ice_" + room, JSON.stringify(event.candidate));
    }
  };

  // FAKE signaling μέσω localStorage (ναι, hack αλλά WORKS σε 2 tabs/2 PCs με sync)
  if (location.hash === "#caller") {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    localStorage.setItem("offer_" + room, JSON.stringify(offer));
    document.getElementById("status").innerText = "offer created";
  } else {
    const offer = JSON.parse(localStorage.getItem("offer_" + room));
    if (!offer) return alert("No offer found. Open caller first.");

    await pc.setRemoteDescription(offer);

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    localStorage.setItem("answer_" + room, JSON.stringify(answer));
    document.getElementById("status").innerText = "answer created";
  }

  // polling answer/offer
  setInterval(async () => {
    const room = document.getElementById("room").value;

    const answer = localStorage.getItem("answer_" + room);
    if (answer && !pc.currentRemoteDescription && location.hash === "#caller") {
      await pc.setRemoteDescription(JSON.parse(answer));
      document.getElementById("status").innerText = "connected";
    }
  }, 1000);
}
</script>

</body>
</html>
