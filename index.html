<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat v3</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, button {
  padding: 8px;
  margin: 5px;
}

#status {
  margin-top: 10px;
  font-weight: bold;
}

#log {
  font-size: 13px;
  color: #444;
  margin-top: 10px;
  white-space: pre-line;
}

#chatBox {
  margin-top: 20px;
  border: 1px solid #ddd;
  height: 200px;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  font-size: 14px;
}

#chatInput {
  border: none;
  border-top: 1px solid #ddd;
  padding: 10px;
}

#users {
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<h2>TMG Voice Chat v3</h2>

<input id="username" placeholder="Username">
<input id="room" value="main" placeholder="Room">
<button id="join">Join</button>

<div id="status">Idle</div>
<div id="log"></div>

<h3>Online Users</h3>
<div id="users"></div>

<h3>Chat</h3>

<div id="chatBox">
  <div id="messages"></div>
  <input id="chatInput" placeholder="type message + Enter">
</div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script type="module">

// ================= FIREBASE =================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  remove,
  push,
  onChildAdded,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  databaseURL: "https://tmg-voice-chat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tmg-voice-chat",
  storageBucket: "tmg-voice-chat.firebasestorage.app",
  messagingSenderId: "928730903900",
  appId: "1:928730903900:web:0744dc6a61163539803d99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chatRef = ref(db, "chat");
const usersRef = ref(db, "users");

// ================= UI =================
const messagesEl = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");
const usersEl = document.getElementById("users");

let user = "";
let myUserRef = null;

function addMsg(u, text) {
  const div = document.createElement("div");
  div.textContent = u + ": " + text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// CHAT SEND
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = chatInput.value.trim();
    if (!text) return;

    push(chatRef, {
      user,
      text,
      time: Date.now()
    });

    chatInput.value = "";
  }
});

// CHAT RECEIVE
onChildAdded(chatRef, (snap) => {
  const msg = snap.val();
  addMsg(msg.user, msg.text);
});

// USERS LIVE (REAL)
onValue(usersRef, (snap) => {
  const data = snap.val() || {};

  usersEl.innerHTML = "";

  Object.values(data).forEach((u) => {
    const div = document.createElement("div");
    div.textContent = "🟢 " + u.name;
    usersEl.appendChild(div);
  });
});

// ================= SKYWAY =================
const APP_ID = "96d919fc-9c10-424b-9e4e-1addf4de2563";
const SECRET = "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk=";

let room;
let me;

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function log(msg) {
  logEl.innerHTML += msg + "<br>";
}

function setStatus(msg) {
  statusEl.innerText = msg;
  log(msg);
}

document.getElementById("join").onclick = async () => {

  const username = document.getElementById("username").value.trim();
  const roomName = document.getElementById("room").value.trim();

  if (!username) return alert("βάλε username");

  user = username;

  setStatus("Loading...");

  const context = await skyway_room.SkyWayContext.CreateForDevelopment(
    APP_ID,
    SECRET
  );

  room = await skyway_room.SkyWayRoom.FindOrCreate(
    context,
    { name: roomName }
  );

  const mic = await skyway_room.SkyWayStreamFactory.createMicrophoneAudioStream();

  me = await room.join({ name: username });

  await me.publish(mic, { type: "p2p" });

  setStatus("Connected ✔");

  log("My ID: " + me.id);

  // ================= USERS ONLINE =================
  myUserRef = ref(db, "users/" + username);

  set(myUserRef, {
    name: username,
    online: true,
    time: Date.now()
  });

  window.addEventListener("beforeunload", () => {
    remove(myUserRef);
  });

  // ================= VOICE =================
  const subscribe = async (publication) => {
    if (publication.publisher.id === me.id) return;

    const { stream } = await me.subscribe(publication.id);

    const audio = document.createElement("audio");
    audio.autoplay = true;

    stream.attach(audio);
    document.body.appendChild(audio);
  };

  room.publications.forEach(subscribe);

  room.onStreamPublished.add((e) => {
    subscribe(e.publication);
  });
};

setStatus("Ready");

</script>

</body>
</html>
