<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat v5 Discord Mode</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f4f4;
}

input, button {
  padding: 8px;
  margin: 5px;
}

#status {
  font-weight: bold;
  margin-top: 10px;
}

#users {
  background: white;
  padding: 10px;
  border-radius: 6px;
}

#chatBox {
  margin-top: 20px;
  background: white;
  border-radius: 6px;
  height: 260px;
  display: flex;
  flex-direction: column;
  border: 1px solid #ddd;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

#chatInput {
  border: none;
  border-top: 1px solid #ddd;
  padding: 10px;
}

.msg { margin-bottom: 5px; }
.system { color: gray; font-style: italic; }

.userRow {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
}
</style>
</head>

<body>

<h2>TMG Voice Chat v5</h2>

<input id="username" placeholder="Username">
<input id="room" value="main">
<button id="join">Join</button>

<button id="muteBtn">🎤 Mute</button>

<div id="status">Idle</div>

<h3>Users</h3>
<div id="users"></div>

<h3>Chat</h3>

<div id="chatBox">
  <div id="messages"></div>
  <input id="chatInput" placeholder="type message + Enter">
</div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  remove,
  push,
  onChildAdded,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQBBQ",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  databaseURL: "https://tmg-voice-chat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tmg-voice-chat",
  storageBucket: "tmg-voice-chat.firebasestorage.app",
  messagingSenderId: "928730903900",
  appId: "1:928730903900:web:0744dc6a61163539803d99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chatRef = ref(db, "chat");
const usersRef = ref(db, "users");

const messagesEl = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");
const usersEl = document.getElementById("users");

let user = "";
let myUserRef = null;
let micStream = null;
let isMuted = false;

// ================= CHAT =================
function addMsg(text, type="msg") {
  const div = document.createElement("div");
  div.className = type;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const text = chatInput.value.trim();
    if (!text) return;

    push(chatRef, {
      user,
      text,
      time: Date.now()
    });

    chatInput.value = "";
  }
});

onChildAdded(chatRef, (snap) => {
  const msg = snap.val();

  if (msg.type === "system") {
    addMsg("• " + msg.text, "system");
  } else {
    addMsg(msg.user + ": " + msg.text);
  }
});

// ================= USERS =================
onValue(usersRef, (snap) => {
  const data = snap.val() || {};
  usersEl.innerHTML = "";

  Object.entries(data).forEach(([id, u]) => {
    const div = document.createElement("div");

    const status = u.speaking ? " 🔊" : " 🟢";

    div.className = "userRow";
    div.innerHTML = `<span>${status} ${u.name}</span>`;

    usersEl.appendChild(div);
  });
});

// ================= SKYWAY =================
const APP_ID = "96d919fc-9c10-424b-9e4e-1addf4de2563";
const SECRET = "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk=";

let room;
let me;

document.getElementById("join").onclick = async () => {

  const username = document.getElementById("username").value.trim();
  const roomName = document.getElementById("room").value.trim();

  if (!username) return;

  user = username;

  const context = await skyway_room.SkyWayContext.CreateForDevelopment(
    APP_ID,
    SECRET
  );

  room = await skyway_room.SkyWayRoom.FindOrCreate(
    context,
    { name: roomName }
  );

  micStream = await skyway_room.SkyWayStreamFactory.createMicrophoneAudioStream();

  me = await room.join({ name: username });

  await me.publish(micStream, { type: "p2p" });

  addMsg("• " + username + " joined", "system");

  myUserRef = ref(db, "users/" + username);

  set(myUserRef, {
    name: username,
    speaking: false,
    time: Date.now()
  });

  window.addEventListener("beforeunload", () => {
    remove(myUserRef);
  });

  // ================= SPEAKING DETECTION =================
  const ctx = new AudioContext();
  const source = ctx.createMediaStreamSource(micStream.stream);
  const analyser = ctx.createAnalyser();
  source.connect(analyser);

  const data = new Uint8Array(analyser.fftSize);

  function detectSpeech() {
    analyser.getByteTimeDomainData(data);

    let volume = 0;
    for (let i = 0; i < data.length; i++) {
      volume += Math.abs(data[i] - 128);
    }

    const speaking = volume > 300;

    set(myUserRef, {
      name: username,
      speaking: speaking,
      time: Date.now()
    });

    requestAnimationFrame(detectSpeech);
  }

  detectSpeech();

  // ================= MUTE =================
  document.getElementById("muteBtn").onclick = () => {
    isMuted = !isMuted;

    micStream.stream.getAudioTracks().forEach(t => {
      t.enabled = !isMuted;
    });

    document.getElementById("muteBtn").innerText =
      isMuted ? "🔇 Unmute" : "🎤 Mute";
  };

  // ================= VOICE =================
  const subscribe = async (pub) => {
    if (pub.publisher.id === me.id) return;

    const { stream } = await me.subscribe(pub.id);

    const audio = document.createElement("audio");
    audio.autoplay = true;

    stream.attach(audio);
    document.body.appendChild(audio);
  };

  room.publications.forEach(subscribe);

  room.onStreamPublished.add(e => subscribe(e.publication));
};

</script>

</body>
</html>
