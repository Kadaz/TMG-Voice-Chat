<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Voice Chat</title>
</head>
<body style="font-family: Arial; text-align:center; padding-top:50px;">

  <h2>🎧 Voice Chat</h2>

  <input id="room" placeholder="Room ID (πχ: test123)" />
  <button onclick="join()">Join</button>

  <p id="status">Not connected</p>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    let peer;
    let call;

    async function join() {
      const roomId = document.getElementById("room").value;

      if (!roomId) return alert("Βάλε Room ID");

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      peer = new Peer(roomId, {
        host: "0.peerjs.com",
        port: 443,
        secure: true
      });

      peer.on('open', () => {
        document.getElementById("status").innerText = "Connected as " + roomId;
      });

      peer.on('call', incoming => {
        incoming.answer(stream);
        incoming.on('stream', remoteStream => {
          playAudio(remoteStream);
        });
      });

      setTimeout(() => {
        const conn = peer.connect(roomId);
        call = peer.call(roomId, stream);

        call.on('stream', remoteStream => {
          playAudio(remoteStream);
        });
      }, 1500);
    }

    function playAudio(stream) {
      const audio = document.createElement("audio");
      audio.srcObject = stream;
      audio.play();
    }
  </script>

</body>
</html>
