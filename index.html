<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat v5.2 Private Calls</title>

<link rel="icon" href="favicon.ico">

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f5f5f5;
  transition: 0.3s;
}

body.dark {
  background: #1e1e1e;
  color: white;
}

input, button {
  padding: 8px;
  margin: 5px;
}

#status {
  font-weight: bold;
}

#users, #chatBox {
  background: white;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
}

body.dark #users,
body.dark #chatBox {
  background: #2a2a2a;
}

.userRow {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
}

.callBtn {
  cursor: pointer;
  font-size: 12px;
  color: blue;
}

#chatBox {
  height: 220px;
  display: flex;
  flex-direction: column;
}

#messages {
  flex: 1;
  overflow-y: auto;
}

#chatInput {
  border: none;
  border-top: 1px solid #ccc;
  padding: 10px;
}

.system { color: gray; font-style: italic; }
.msg { margin: 3px 0; }
</style>
</head>

<body>

<h2>TMG Voice Chat v5.2</h2>

<input id="username" placeholder="Username">
<input id="room" value="main">

<button id="join">Join</button>
<button id="mute">Mute</button>
<button id="leave">Leave</button>
<button id="dark">Dark</button>
<button id="backMain" style="display:none;">Back to Main</button>

<div id="status">Idle</div>

<h3>Users</h3>
<div id="users"></div>

<h3>Chat</h3>
<div id="chatBox">
  <div id="messages"></div>
  <input id="chatInput" placeholder="message + Enter">
</div>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  remove,
  push,
  onChildAdded,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQBBQ",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  databaseURL: "https://tmg-voice-chat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tmg-voice-chat",
  storageBucket: "tmg-voice-chat.firebasestorage.app",
  messagingSenderId: "928730903900",
  appId: "1:928730903900:web:0744dc6a61163539803d99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const chatRef = ref(db, "chat");
const usersRef = ref(db, "users");

const messagesEl = document.getElementById("messages");
const usersEl = document.getElementById("users");
const statusEl = document.getElementById("status");

let user = "";
let myUserRef = null;

let room = null;
let me = null;
let mic = null;

let currentRoomName = "main";

// ================= STATUS =================
function setStatus(t){ statusEl.innerText = t; }

// ================= CHAT =================
function addMsg(t, type="msg"){
  const d = document.createElement("div");
  d.className = type;
  d.textContent = t;
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ================= USERS LIST =================
onValue(usersRef, (snap)=>{
  const data = snap.val() || {};
  usersEl.innerHTML = "";

  Object.entries(data).forEach(([id,u])=>{
    const row = document.createElement("div");
    row.className = "userRow";

    row.innerHTML = `
      <span>🟢 ${u.name}</span>
      <span class="callBtn" data-name="${u.name}">call</span>
    `;

    usersEl.appendChild(row);
  });

  document.querySelectorAll(".callBtn").forEach(btn=>{
    btn.onclick = () => startPrivateCall(btn.dataset.name);
  });
});

// ================= SKYWAY JOIN =================
document.getElementById("join").onclick = async ()=>{

  setStatus("Connecting...");

  user = document.getElementById("username").value.trim();
  const roomName = document.getElementById("room").value.trim();

  if(!user) return;

  currentRoomName = roomName;

  const context = await skyway_room.SkyWayContext.CreateForDevelopment(
    "96d919fc-9c10-424b-9e4e-1addf4de2563",
    "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk="
  );

  room = await skyway_room.SkyWayRoom.FindOrCreate(context,{name:roomName});

  mic = await skyway_room.SkyWayStreamFactory.createMicrophoneAudioStream();

  me = await room.join({name:user});
  await me.publish(mic,{type:"p2p"});

  setStatus("Connected ✔");

  myUserRef = ref(db,"users/"+user);

  set(myUserRef,{
    name:user,
    room:roomName
  });

  const subscribe = async(pub)=>{
    if(pub.publisher.id===me.id) return;

    const {stream} = await me.subscribe(pub.id);

    const audio = document.createElement("audio");
    audio.autoplay = true;

    stream.attach(audio);
    document.body.appendChild(audio);
  };

  room.publications.forEach(subscribe);
  room.onStreamPublished.add(e=>subscribe(e.publication));
};

// ================= PRIVATE CALL =================
async function startPrivateCall(targetUser){

  const privateRoom = "dm-" + [user,targetUser].sort().join("-");

  setStatus("Calling " + targetUser + "...");

  if(room) await room.leave();

  const context = await skyway_room.SkyWayContext.CreateForDevelopment(
    "96d919fc-9c10-424b-9e4e-1addf4de2563",
    "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk="
  );

  room = await skyway_room.SkyWayRoom.FindOrCreate(context,{
    name: privateRoom
  });

  me = await room.join({name:user});

  mic = await skyway_room.SkyWayStreamFactory.createMicrophoneAudioStream();
  await me.publish(mic,{type:"p2p"});

  setStatus("Private call with " + targetUser);

  document.getElementById("backMain").style.display="inline-block";

  const subscribe = async(pub)=>{
    if(pub.publisher.id===me.id) return;

    const {stream} = await me.subscribe(pub.id);

    const audio = document.createElement("audio");
    audio.autoplay = true;

    stream.attach(audio);
    document.body.appendChild(audio);
  };

  room.publications.forEach(subscribe);
  room.onStreamPublished.add(e=>subscribe(e.publication));
}

// ================= BACK TO MAIN =================
document.getElementById("backMain").onclick = async ()=>{

  location.reload();
};

// ================= MUTE =================
document.getElementById("mute").onclick = ()=>{
  if(!mic) return;

  const track = mic.stream.getAudioTracks()[0];
  track.enabled = !track.enabled;

  document.getElementById("mute").innerText =
    track.enabled ? "Mute" : "Unmute";
};

// ================= LEAVE =================
document.getElementById("leave").onclick = ()=>{
  if(myUserRef) remove(myUserRef);
  location.reload();
};

// ================= DARK MODE =================
document.getElementById("dark").onclick = ()=>{
  document.body.classList.toggle("dark");
};

</script>

</body>
</html>
