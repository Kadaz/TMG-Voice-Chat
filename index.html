<!DOCTYPE html>
<html>
<head>
  <title>Voice Chat FIX</title>
</head>
<body>

<h2>🎤 Voice Chat (REAL FIXED VERSION)</h2>

<button id="start">Start</button>
<button id="join">Join</button>

<audio id="audio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  projectId: "tmg-voice-chat"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

let pc;
let localStream;

async function createPeer() {
  pc = new RTCPeerConnection(servers);

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    document.getElementById("audio").srcObject = event.streams[0];
  };

  pc.onicecandidate = async (event) => {
    if (event.candidate) {
      await setDoc(doc(db, "room", "candidate"), {
        c: JSON.stringify(event.candidate)
      });
    }
  };
}

// 🟢 CALLER
document.getElementById("start").onclick = async () => {
  await createPeer();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(doc(db, "room", "offer"), {
    o: JSON.stringify(offer)
  });
};

// 🟢 JOINER
document.getElementById("join").onclick = async () => {
  await createPeer();

  const offerDoc = await getDoc(doc(db, "room", "offer"));
  const offer = JSON.parse(offerDoc.data().o);

  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await setDoc(doc(db, "room", "answer"), {
    a: JSON.stringify(answer)
  });

  onSnapshot(doc(db, "room", "answer"), (snap) => {
    const data = snap.data();
    if (data && data.a) {
      pc.setRemoteDescription(JSON.parse(data.a));
    }
  });
};
</script>

</body>
</html>
