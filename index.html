<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie Talkie (GitHub Pages)</title>
    <!-- Χρησιμοποιούμε PeerJS μόνο για να στέλνουμε τα αρχεία ήχου -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #eef2f7; color: #333; }
        .box { background: white; padding: 30px; border-radius: 15px; width: 320px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-talk { background: #dc3545; color: white; border: none; padding: 20px; border-radius: 50%; width: 120px; height: 120px; font-weight: bold; cursor: pointer; font-size: 16px; margin: 20px 0; box-shadow: 0 4px 10px rgba(220,53,69,0.4); user-select: none; -webkit-user-select: none; }
        .btn-talk:active { background: #bd2130; transform: scale(0.95); }
        .btn-conn { background: #007bff; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        input { padding: 10px; width: 90%; text-align: center; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #status { font-weight: bold; margin-top: 15px; padding: 10px; border-radius: 5px; background: #e2e3e5; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Walkie Talkie</h3>
        <p>Το ID σου: <span id="my-id" style="font-weight:bold; color:#007bff; font-size: 20px;">...</span></p>
        <hr>
        
        <input type="text" id="peer-id" placeholder="Βάλε το ID του φίλου">
        <button id="conn-btn" class="btn-conn">Σύνδεση με φίλο</button>
        
        <!-- Κρατήστε πατημένο για να μιλήσετε -->
        <button id="talk-btn" class="btn-talk" disabled>ΚΡΑΤΑ ΤΟ<br>ΓΙΑ ΝΑ ΜΙΛΗΣΕΙΣ</button>
        
        <div id="status">Σύνδεση στον server...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const talkBtn = document.getElementById('talk-btn');
        const connBtn = document.getElementById('conn-btn');
        
        let peer = null;
        let connection = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // 1. Σύνδεση στον Server με τυχαίο ID
        const myId = Math.floor(1000 + Math.random() * 9000).toString();
        peer = new Peer(myId);

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            statusDiv.innerText = "Έτοιμο. Βάλε το ID του φίλου σου και πάτα Σύνδεση.";
            setupMicrophone();
        });

        // Προετοιμασία εγγραφής ήχου (χωρίς WebRTC κλήση)
        function setupMicrophone() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
                        audioChunks = [];
                        
                        // Στέλνουμε το ηχητικό αρχείο στον άλλον
                        if (connection && connection.open) {
                            connection.send(audioBlob);
                            statusDiv.innerText = "Το μήνυμα στάλθηκε!";
                        } else {
                            statusDiv.innerText = "Σφάλμα: Δεν είστε συνδεδεμένοι με κάποιον.";
                        }
                    };
                })
                .catch(err => {
                    statusDiv.innerText = "Αποτυχία μικροφώνου: " + err.message;
                });
        }

        // 2. Όταν ΕΜΕΙΣ πατάμε σύνδεση
        connBtn.addEventListener('click', () => {
            const remoteId = document.getElementById('peer-id').value.trim();
            if (!remoteId) return alert("Βάλε ID!");
            
            statusDiv.innerText = "Σύνδεση με τον " + remoteId + "...";
            connection = peer.connect(remoteId);
            setupConnectionEvents();
        });

        // 3. Όταν ο ΑΛΛΟΣ συνδέεται μαζί μας
        peer.on('connection', (conn) => {
            connection = conn;
            setupConnectionEvents();
        });

        function setupConnectionEvents() {
            connection.on('open', () => {
                statusDiv.innerText = "Συνδέθηκε! Κρατήστε πατημένο το κόκκινο κουμπί για να μιλήσετε.";
                talkBtn.disabled = false;
            });

            // Όταν λαμβάνουμε το ηχητικό αρχείο από τον άλλον, το παίζουμε αμέσως
            connection.on('data', (data) => {
                statusDiv.innerText = "Λήψη ήχου...";
                const audioUrl = URL.createObjectURL(data);
                const audio = new Audio(audioUrl);
                audio.play();
                statusDiv.innerText = "Αναπαραγωγή ήχου... Ακούτε τον φίλο σας.";
            });
        }

        // 4. Λειτουργία Κουμπιού (Push to Talk)
        // Για υπολογιστές (κλικ με το ποντίκι)
        talkBtn.addEventListener('mousedown', startRecording);
        talkBtn.addEventListener('mouseup', stopRecording);
        
        // Για κινητά (άγγιγμα με το δάχτυλο)
        talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        talkBtn.addEventListener('touchend', stopRecording);

        function startRecording() {
            if (!mediaRecorder) return;
            audioChunks = [];
            mediaRecorder.start();
            statusDiv.innerText = "Σας ακούει... Μιλήστε τώρα!";
            talkBtn.style.background = "#28a745";
        }

        function stopRecording() {
            if (!mediaRecorder || mediaRecorder.state === "inactive") return;
            mediaRecorder.stop();
            talkBtn.style.background = "#dc3545";
        }
    </script>
</body>
</html>
