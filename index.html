<!DOCTYPE html>
<html>
<head>
  <title>Working Voice Chat</title>
</head>
<body>

<h2>🎤 WebRTC (WORKING SIMPLE VERSION)</h2>

<button id="start">Create Call</button>
<button id="join">Join Call</button>

<p>Offer:</p>
<textarea id="offer" rows="6" cols="50"></textarea><br>

<p>Answer:</p>
<textarea id="answer" rows="6" cols="50"></textarea><br>

<button id="setRemote">Set Remote</button>

<audio id="audio" autoplay></audio>

<script>
let pc;
let localStream;

const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

async function createPeer() {
  pc = new RTCPeerConnection(servers);

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    document.getElementById("audio").srcObject = event.streams[0];
  };
}

/* ===================== CALLER ===================== */
document.getElementById("start").onclick = async () => {
  await createPeer();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  document.getElementById("offer").value =
    JSON.stringify(pc.localDescription);
};

/* ===================== JOINER ===================== */
document.getElementById("join").onclick = async () => {
  await createPeer();
};

/* ===================== SET REMOTE ===================== */
document.getElementById("setRemote").onclick = async () => {

  const offerText = document.getElementById("offer").value;
  const answerText = document.getElementById("answer").value;

  if (!pc) return;

  if (offerText && !pc.currentRemoteDescription) {
    await pc.setRemoteDescription(JSON.parse(offerText));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    document.getElementById("answer").value =
      JSON.stringify(pc.localDescription);
  }

  if (answerText) {
    await pc.setRemoteDescription(JSON.parse(answerText));
  }
};
</script>

</body>
</html>
