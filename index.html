<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Serverless Voice Chat</title>
    <!-- Εισαγωγή της Bugout βιβλιοθήκης για αυτόματη σύνδεση χωρίς server -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #eef2f7; color: #333; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 340px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button { background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 15px; }
        button:hover { background: #218838; }
        #status { font-weight: bold; margin-top: 20px; padding: 10px; border-radius: 6px; background: #e2e3e5; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Instant Voice Chat</h3>
        <p style="font-size: 13px; color: #666;">Ανοίξτε και οι δύο το ίδιο link στο GitHub Pages.</p>
        <hr>
        
        <button id="start-btn">Ενεργοποίηση Μικροφώνου</button>
        
        <div id="status">Πατήστε το κουμπί για να ξεκινήσετε.</div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');
        const remoteAudio = document.getElementById('remote-audio');

        let localStream = null;
        let pc = null;
        let bgt = null;

        // Ένα κοινό "κλειδί δωματίου" για να βρεθείτε. 
        // Αν θέλετε να είστε μόνοι σας, αλλάξτε απλά αυτή τη λέξη.
        const roomToken = "github-voice-room-shared-token-123";

        startBtn.addEventListener('click', () => {
            statusDiv.innerText = "Άνοιγμα μικροφώνου...";
            
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "Σύνδεση στο δίκτυο... Παρακαλώ περιμένετε...";
                    
                    // Σύνδεση στο Serverless δίκτυο
                    bgt = new Bugout(roomToken);
                    initWebRTC();
                })
                .catch(err => {
                    statusDiv.innerText = "Σφάλμα μικροφώνου: " + err.message;
                });
        });

        function initWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:://google.com' }]
            });

            // Προσθήκη του ήχου μας
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // Λήψη του ήχου του άλλου χρήστη
            pc.ontrack = (event) => {
                remoteAudio.srcObject = event.streams;
                statusDiv.innerText = "ΣΥΝΔΕΘΗΚΕ! Μιλήστε ελεύθερα.";
                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
            };

            // Αυτόματη αποστολή δικτυακών σημάτων (ICE Candidates)
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    bgt.send({ 'ice': event.candidate });
                }
            };

            // Όταν η Bugout λάβει σήμα από τον άλλον browser
            bgt.on("message", async (address, data) => {
                if (data.offer && pc.signalingState === "stable") {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    bgt.send({ 'answer': pc.localDescription });
                } 
                else if (data.answer && pc.signalingState === "have-local-offer") {
                    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                } 
                else if (data.ice) {
                    pc.addIceCandidate(new RTCIceCandidate(data.ice)).catch(e => {});
                }
            });

            statusDiv.innerText = "Αναμονή για τον φίλο σας... Μόλις μπει, θα συνδεθεί μόνο του.";

            // Δημιουργία αυτόματης πρόσκλησης (Offer)
            setTimeout(async () => {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                bgt.send({ 'offer': pc.localDescription });
            }, 1500);
        }
    </script>
</body>
</html>
