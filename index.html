<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TMG Voice Chat (Stable)</title>

<style>
body { font-family: Arial; padding: 20px; }
input, button { padding: 8px; margin: 5px; }
#log { margin-top: 10px; font-size: 13px; color: #444; }
audio { display:block; margin-top: 5px; }
</style>
</head>

<body>

<h2>TMG Voice Chat - Stable</h2>

<input id="username" placeholder="Username">
<input id="room" value="main" placeholder="Room">
<button id="join">Join</button>

<div id="status">Idle</div>
<div id="log"></div>

<hr>

<script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room/dist/skyway_room-latest.js"></script>

<script>

const APP_ID = "96d919fc-9c10-424b-9e4e-1addf4de2563";
const SECRET = "dHmHOdbLzFx1Kr7YtKc7P7HPOcWgHHPN0RcyYr7AFsk=";

let context;
let room;
let me;

const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function log(msg) {
  console.log(msg);
  logEl.innerHTML += msg + "<br>";
}

function setStatus(msg) {
  statusEl.innerText = msg;
  log(msg);
}

async function wait(ms) {
  return new Promise(r => setTimeout(r, ms));
}

document.getElementById("join").onclick = async () => {

  const username = document.getElementById("username").value.trim();
  const roomName = document.getElementById("room").value.trim();

  if (!username || !roomName) {
    alert("Fill username + room");
    return;
  }

  try {

    setStatus("Creating context...");

    context = await skyway_room.SkyWayContext.CreateForDevelopment(
      APP_ID,
      SECRET
    );

    setStatus("Finding room...");

    room = await skyway_room.SkyWayRoom.FindOrCreate(
      context,
      { name: roomName }
    );

    setStatus("Getting microphone...");

    const mic =
      await skyway_room.SkyWayStreamFactory
        .createMicrophoneAudioStream();

    setStatus("Joining room...");

    me = await room.join({ name: username });

    setStatus("Publishing audio...");

    await me.publish(mic, { type: "p2p" });

    document.body.addEventListener("click", async () => {
      const a = new Audio();
      await a.play().catch(()=>{});
    }, { once: true });

    setStatus("Connected ✔");

    log("My ID: " + me.id);

    // SUBSCRIBE FUNCTION
    const subscribe = async (publication) => {

      if (publication.publisher.id === me.id) return;

      try {

        log("Subscribing: " + publication.publisher.id);

        const { stream } = await me.subscribe(publication.id);

        const audio = document.createElement("audio");
        audio.autoplay = true;
        audio.playsInline = true;

        stream.attach(audio);
        document.body.appendChild(audio);

        await audio.play().catch(e => log("play blocked"));

      } catch (err) {
        log("SUB FAIL: " + err.message);
      }
    };

    // existing
    room.publications.forEach(subscribe);

    // new
    room.onStreamPublished.add((e) => {
      subscribe(e.publication);
    });

    // 🔥 CRITICAL: detect stuck state
    let timeout = setTimeout(() => {
      if (!me) {
        setStatus("STUCK CONNECTING ❌ (retry recommended)");
      }
    }, 8000);

  } catch (err) {
    setStatus("ERROR: " + err.message);
    log(err.stack || err);
  }

};

</script>

</body>
</html>
