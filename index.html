<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto LAN Voice Chat</title>
    <!-- Εισαγωγή της βιβλιοθήκης PubNub για αυτόματο LAN Handshake -->
    <script src="https://pubnub.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #eef2f7; color: #333; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 350px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 15px; }
        button:hover { background: #218838; }
        #status { font-weight: bold; margin-top: 20px; padding: 12px; border-radius: 6px; background: #e2e3e5; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h3>LAN Voice Chat (Auto)</h3>
        <p style="font-size: 13px; color: #666;">Ανοίξτε και οι δύο τη σελίδα στο ίδιο δίκτυο LAN.</p>
        <hr>
        
        <button id="start-btn">Ενεργοποίηση & Σύνδεση</button>
        
        <div id="status">Πατήστε το κουμπί για να ξεκινήσει η αυτόματη σύνδεση LAN.</div>
    </div>

    <!-- Στοιχείο για τον ήχο του άλλου χρήστη -->
    <audio id="remote-audio" autoplay></audio>

    <script>
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const remoteAudio = document.getElementById('remote-audio');

        let localStream;
        let pc;
        let pubnub;
        
        // Κοινό όνομα καναλιού για το LAN σας
        const CHANNEL_NAME = "lan_voice_handshake_room_xyz"; 

        startBtn.addEventListener('click', () => {
            statusDiv.innerText = "Ανοιγμα μικροφώνου...";
            
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "Αναζήτηση άλλου υπολογιστή στο LAN...";
                    
                    // Αρχιικοποίηση PubNub με δωρεάν demo κλειδιά
                    pubnub = new PubNub({
                        publishKey: 'pub-c-db252277-c917-48f0-b6f7-b76da89345e6',
                        subscribeKey: 'sub-c-5fec84d2-dca0-11e9-913b-12d8a56209eb',
                        userId: "user_" + Math.floor(Math.random() * 1000)
                    });

                    initLANWebRTC();
                })
                .catch(err => {
                    statusDiv.innerText = "Σφάλμα μικροφώνου: " + err.message;
                });
        });

        function initLANWebRTC() {
            // Δημιουργία WebRTC σύνδεσης (Καθαρό LAN χωρίς εξωτερικούς servers)
            pc = new RTCPeerConnection({ iceServers: [] });

            // Προσθήκη του ήχου μας
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // Όταν λάβουμε τον ήχο του άλλου υπολογιστή στο LAN
            pc.ontrack = (event) => {
                remoteAudio.srcObject = event.streams;
                statusDiv.innerText = "ΣΥΝΔΕΘΗΚΕ! Μιλήστε ελεύθερα στο LAN.";
                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
            };

            // Λήψη μηνυμάτων από το PubNub (Αυτόματο handshake)
            pubnub.addListener({
                message: async (payload) => {
                    // Αγνοούμε τα δικά μας μηνύματα
                    if (payload.publisher === pubnub.getUserId()) return;

                    const data = payload.message;

                    if (data.offer && pc.signalingState === "stable") {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        
                        // Στέλνουμε την απάντηση αυτόματα πίσω
                        pubnub.publish({
                            channel: CHANNEL_NAME,
                            message: { answer: pc.localDescription }
                        });
                    } 
                    else if (data.answer && pc.signalingState === "have-local-offer") {
                        await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                    }
                }
            });

            // Εγγραφή στο κανάλι για να ακούμε
            pubnub.subscribe({ channels: [CHANNEL_NAME] });

            // Περιμένουμε 1 δευτερόλεπτο και στέλνουμε αυτόματα την πρόσκληση (Offer) στο LAN
            setTimeout(async () => {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                pubnub.publish({
                    channel: CHANNEL_NAME,
                    message: { offer: pc.localDescription }
                });
            }, 1000);
        }
    </script>
</body>
</html>
