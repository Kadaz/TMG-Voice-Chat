<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Voice Chat</title>
    <!-- Εισαγωγή της βιβλιοθήκης PeerJS για P2P σύνδεση -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .box { background: white; padding: 30px; border-radius: 10px; inline-size: 300px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-block-start: 10px; }
        button:hover { background: #0056b3; }
        input { padding: 10px; width: 80px; text-align: center; margin-block-end: 10px; }
        #status { font-weight: bold; margin-block-start: 20px; color: #555; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Voice Chat</h3>
        
        <p>Το ID σου: <span id="my-id" style="font-weight:bold; color:green;">...</span></p>
        
        <hr>
        
        <p>Σύνδεση με peer:</p>
        <input type="text" id="peer-id" placeholder="ID φίλου">
        <br>
        <button id="call-btn">Κλήση (Ήχος)</button>

        <div id="status">Έτοιμο. Περιμένει σύνδεση...</div>
    </div>

    <!-- Κρυφό στοιχείο για την αναπαραγωγή του ήχου του άλλου χρήστη -->
    <audio id="remote-audio" autoplay></audio>

    <script>
        // Δημιουργία τυχαίου 4ψήφιου ID για απλότητα
        const myId = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('my-id').innerText = myId;

        // Σύνδεση στον δωρεάν server της PeerJS
        const peer = new Peer(myId);
        const statusDiv = document.getElementById('status');

        // 1. Υποδοχή εισερχόμενης κλήσης
        peer.on('call', (call) => {
            statusDiv.innerText = "Εισερχόμενη κλήση... Σύνδεση μικροφώνου...";
            
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then((stream) => {
                    call.answer(stream); // Απάντηση με το δικό μας μικρόφωνο
                    statusDiv.innerText = "Σε κλήση! (Μιλήστε)";
                    
                    // Λήψη ήχου του άλλου
                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-audio').srcObject = remoteStream;
                    });
                })
                .catch(err => {
                    statusDiv.innerText = "Σφάλμα πρόσβασης στο μικρόφωνο.";
                    console.error(err);
                });
        });

        // 2. Πραγματοποίηση εξερχόμενης κλήσης (Όταν πατάμε το κουμπί)
        document.getElementById('call-btn').addEventListener('click', () => {
            const remoteId = document.getElementById('peer-id').value;
            if (!remoteId) return alert("Βάλε το ID του φίλου σου!");

            statusDiv.innerText = "Κλήση στον " + remoteId + "...";

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then((stream) => {
                    const call = peer.call(remoteId, stream);
                    statusDiv.innerText = "Σε κλήση! (Μιλήστε)";
                    
                    // Λήψη ήχου του άλλου
                    call.on('stream', (remoteStream) => {
                        document.getElementById('remote-audio').srcObject = remoteStream;
                    });
                })
                .catch(err => {
                    statusDiv.innerText = "Σφάλμα πρόσβασης στο μικρόφωνο.";
                    console.error(err);
                });
        });
    </script>
</body>
</html>
