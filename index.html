<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Voice Chat (GitHub Pages)</title>
    <!-- Εισαγωγή της GunDB για αυτόματο handshake χωρίς δικό μας server -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f0f2f5; color: #333; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 340px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 15px; }
        button:hover { background: #218838; }
        #status { font-weight: bold; margin-top: 20px; padding: 10px; border-radius: 6px; background: #e2e3e5; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Auto Voice Chat</h3>
        <p style="font-size: 13px; color: #666;">Η κλήση θα ξεκινήσει αυτόματα μόλις μπείτε στο ίδιο δωμάτιο.</p>
        <hr>
        
        <button id="start-btn">1. Ενεργοποίηση Μικροφώνου</button>
        
        <div id="status">Πατήστε το πράσινο κουμπί για να ξεκινήσετε.</div>
    </div>

    <!-- Κρυφό στοιχείο για τον ήχο του άλλου -->
    <audio id="remote-audio" autoplay></audio>

    <script>
        const startBtn = document.getElementById('start-btn');
        const statusDiv = document.getElementById('status');
        const remoteAudio = document.getElementById('remote-audio');

        let localStream = null;
        let pc = null;
        let gun = null;
        let room = null;

        // Δημιουργούμε ένα σταθερό όνομα δωματίου. 
        // Αν θέλετε άλλο δωμάτιο, απλά αλλάξτε αυτή τη λέξη.
        const roomName = "greece-voice-room-123"; 

        startBtn.addEventListener('click', () => {
            statusDiv.innerText = "Ανοιγμα μικροφώνου... Πατήστε Αποδοχή.";
            
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "Σύνδεση στο δίκτυο... Παρακαλώ περιμένετε...";
                    
                    // Σύνδεση στους δωρεάν δημόσιους servers της GunDB
                    gun = Gun(['https://herokuapp.com']);
                    room = gun.get(roomName);

                    initWebRTC();
                })
                .catch(err => {
                    statusDiv.innerText = "Σφάλμα μικροφώνου: " + err.message;
                });
        });

        function initWebRTC() {
            // Καθαρή σύνδεση WebRTC με δωρεάν STUN της Google
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:://google.com' }]
            });

            // Προσθήκη του ήχου μας
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // Όταν έρθει ο ήχος του άλλου
            pc.ontrack = (event) => {
                remoteAudio.srcObject = event.streams[0];
                statusDiv.innerText = "Συνδέθηκε! Μιλήστε ελεύθερα.";
                statusDiv.style.background = "#d4edda";
                statusDiv.style.color = "#155724";
            };

            // Αυτόματη αποστολή δικτυακών στοιχείων (ICE Candidates)
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    room.get('ice').put(JSON.stringify(event.candidate));
                }
            };

            // Ακούμε αν ο άλλος υπολογιστής έστειλε Πρόσκληση (Offer) ή Απάντηση (Answer)
            room.on((data) => {
                if (!data) return;

                if (data.offer && pc.signalingState === "stable") {
                    const offer = JSON.parse(data.offer);
                    pc.setRemoteDescription(new RTCSessionDescription(offer))
                        .then(() => pc.createAnswer())
                        .then(answer => pc.setLocalDescription(answer))
                        .then(() => {
                            room.get('answer').put(JSON.stringify(pc.localDescription));
                        });
                }

                if (data.answer && pc.signalingState === "have-local-offer") {
                    const answer = JSON.parse(data.answer);
                    pc.setRemoteDescription(new RTCSessionDescription(answer));
                }

                if (data.ice) {
                    const candidate = JSON.parse(data.ice);
                    pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => {});
                }
            });

            // Ο πρώτος που μπαίνει δημιουργεί αυτόματα την πρόσκληση (Offer)
            statusDiv.innerText = "Αναμονή για τον φίλο σας... (Μόλις μπει, θα συνδεθεί μόνο του)";
            
            pc.createOffer()
                .then(offer => pc.setLocalDescription(offer))
                .then(() => {
                    room.get('offer').put(JSON.stringify(pc.localDescription));
                });
        }
    </script>
</body>
</html>
