<!DOCTYPE html>
<html>
<head>
  <title>REAL WebRTC Voice</title>
</head>
<body>

<h2>🎤 WebRTC Voice (FIXED)</h2>

<button id="start">Start (Caller)</button>
<button id="join">Join (Receiver)</button>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } 
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBQDKV4YiwW8CBlxSXwgV6ppGuvC_mLPs",
  authDomain: "tmg-voice-chat.firebaseapp.com",
  projectId: "tmg-voice-chat"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

let pc;
let localStream;

/* =====================
   CREATE PEER
===================== */
async function createPeer() {
  pc = new RTCPeerConnection(servers);

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    document.getElementById("remoteAudio").srcObject = event.streams[0];
  };

  // IMPORTANT: ICE candidates stream (REAL FIX)
  pc.onicecandidate = async (event) => {
    if (event.candidate) {
      await setDoc(doc(db, "call", "candidate"), {
        c: JSON.stringify(event.candidate)
      });
    }
  };

  // listen for remote ICE
  onSnapshot(doc(db, "call", "candidate"), async (snap) => {
    const data = snap.data();
    if (data?.c && pc) {
      try {
        await pc.addIceCandidate(JSON.parse(data.c));
      } catch (e) {}
    }
  });
}

/* =====================
   CALLER
===================== */
document.getElementById("start").onclick = async () => {
  await createPeer();

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(doc(db, "call", "offer"), {
    o: JSON.stringify(offer)
  });

  onSnapshot(doc(db, "call", "answer"), async (snap) => {
    const data = snap.data();
    if (data?.a && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(JSON.parse(data.a));
    }
  });
};

/* =====================
   JOINER
===================== */
document.getElementById("join").onclick = async () => {
  await createPeer();

  const offerSnap = await getDoc(doc(db, "call", "offer"));
  const offer = JSON.parse(offerSnap.data().o);

  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await setDoc(doc(db, "call", "answer"), {
    a: JSON.stringify(answer)
  });
};
</script>

</body>
</html>
